<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7iDeas · App del profesional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="css/llamador.css">
<link rel="stylesheet" href="css/llamador-brand.css">
</head>
<body class="ll-mobile">
<header class="ll-topbar">
  <div class="ll-mark"><span class="dot"></span> 7iDeas · Mi consultorio</div>
  <span class="ll-role">Vista del Profesional · ve nombres completos</span>
  <span style="display:inline-flex;gap:var(--sp-4)"><a class="ll-back" href="index.html">← Volver</a><a class="ll-back" href="../index.html">Catálogo</a></span>
</header>
<main class="mobile-shell">
  <div class="field mobile-select">
    <label class="field-label" for="mobileConsultorio">Consultorio</label>
    <select class="select" id="mobileConsultorio"></select>
  </div>

  <div class="mobile-current" id="mobileCurrent"></div>

  <div class="mobile-actions">
    <button class="btn btn-accent btn-block mobile-primary" id="btnLlamar" type="button">Llamar siguiente</button>
    <div class="mobile-actions-row">
      <button class="btn btn-secondary" id="btnRepetir" type="button">Volver a llamar</button>
      <button class="btn btn-secondary" id="btnFinalizar" type="button">Finalizar atención</button>
    </div>
  </div>

  <section aria-labelledby="mobileColaTitle">
    <div class="mobile-cola-title" id="mobileColaTitle"></div>
    <div class="panel-cola-list" id="mobileCola"></div>
  </section>
</main>
<div class="toast-stack" id="toastStack"></div>
<script src="js/llamador.js"></script>
<script>
  let activeId = LL_CONSULTORIOS[0].id;

  function showToast(message) {
    const stack = document.getElementById('toastStack');
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg><span>${message}</span>`;
    stack.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('is-visible'));
    setTimeout(() => {
      toast.classList.remove('is-visible');
      setTimeout(() => toast.remove(), 250);
    }, 2400);
  }

  const select = document.getElementById('mobileConsultorio');
  select.innerHTML = LL_CONSULTORIOS.map((c) => `<option value="${c.id}">${c.nombre} · ${c.profesional}</option>`).join('');
  select.addEventListener('change', () => { activeId = select.value; render(); });

  function render() {
    const state = llGetState();
    const c = llConsultorio(activeId);
    const paciente = state.atendiendo[activeId];
    const cola = state.colas[activeId] || [];

    document.getElementById('mobileCurrent').innerHTML = `
      <div class="mobile-current-label">Atendiendo ahora · ${c.nombre}</div>
      <div class="mobile-current-body">
      ${paciente
        ? `<div class="mobile-current-name">${paciente.nombre}</div><div class="mobile-current-turno">Turno ${paciente.turno}</div>`
        : `<div class="mobile-current-name is-empty">Sin paciente en atención</div>`}
      </div>`;

    document.getElementById('btnLlamar').disabled = cola.length === 0;
    document.getElementById('btnRepetir').disabled = !paciente;
    document.getElementById('btnFinalizar').disabled = !paciente;

    document.getElementById('mobileColaTitle').textContent = `Cola de espera · ${cola.length} paciente${cola.length === 1 ? '' : 's'}`;
    document.getElementById('mobileCola').innerHTML = cola.length
      ? cola.map((p, i) => `<div class="panel-cola-row"><span class="panel-cola-pos">${i + 1}</span><span class="doc-name">${p.nombre}</span><span class="panel-cola-turno">Turno ${p.turno}</span></div>`).join('')
      : `<div class="panel-cola-row" style="color: var(--gray-600)">No hay pacientes esperando</div>`;
  }

  document.getElementById('btnLlamar').addEventListener('click', () => {
    llLlamarSiguiente(activeId);
    showToast('Paciente llamado');
    render();
  });
  document.getElementById('btnRepetir').addEventListener('click', () => {
    llVolverALlamar(activeId);
    showToast('Llamando nuevamente');
    render();
  });
  document.getElementById('btnFinalizar').addEventListener('click', () => {
    llFinalizarAtencion(activeId);
    render();
  });

  render();
  llOnStateChange(render);
</script>
</body>
</html>
