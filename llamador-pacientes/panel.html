<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de control · Llamador de Pacientes</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="css/llamador.css">
</head>
<body>
<header class="ll-topbar">
  <div class="ll-mark"><span class="dot"></span> Panel de control</div>
  <span class="ll-role">Vista de Recepción · ve nombres completos</span>
  <a class="ll-back" href="index.html">← Volver</a>
</header>
<div class="panel-shell">
  <nav class="panel-side" aria-label="Consultorios">
    <div class="panel-side-title">Consultorios</div>
    <div id="panelConsultorios"></div>
    <button class="btn btn-ghost btn-sm btn-block" id="panelReset" type="button" style="margin-top: var(--sp-4)">Reiniciar demo</button>
  </nav>
  <main class="panel-main">
    <div class="panel-current" id="panelCurrent"></div>
    <section class="panel-cola" aria-labelledby="panelColaTitle">
      <div class="panel-cola-title" id="panelColaTitle"></div>
      <div class="panel-cola-list" id="panelCola"></div>
    </section>
  </main>
</div>
<div class="toast-stack" id="toastStack"></div>
<script src="js/llamador.js"></script>
<script>
  let activeId = LL_CONSULTORIOS[0].id;

  function focusAction(id) {
    const btn = document.getElementById(id);
    if (btn && !btn.disabled) { btn.focus(); return; }
    const fallback = document.getElementById('panelCurrent');
    fallback.setAttribute('tabindex', '-1');
    fallback.focus();
  }

  function showToast(message) {
    const stack = document.getElementById('toastStack');
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg><span>${message}</span>`;
    stack.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('is-visible'));
    setTimeout(() => {
      toast.classList.remove('is-visible');
      setTimeout(() => toast.remove(), 250);
    }, 2400);
  }

  function render() {
    const state = llGetState();

    const side = document.getElementById('panelConsultorios');
    side.innerHTML = LL_CONSULTORIOS.map((c) => {
      const cola = state.colas[c.id] || [];
      const num = (c.nombre.match(/\d+/) || [c.nombre])[0];
      return `<button class="panel-consultorio-btn${c.id === activeId ? ' is-active' : ''}" data-id="${c.id}" type="button" aria-label="${c.nombre}, ${cola.length} en espera">
        <span class="panel-consultorio-num" aria-hidden="true">${num}</span>
        <span class="panel-consultorio-info">
          <span class="panel-consultorio-nombre">${c.profesional}</span>
          <span class="panel-consultorio-prof">${c.especialidad}</span>
        </span>
        <span class="panel-consultorio-count${cola.length ? '' : ' is-zero'}" aria-hidden="true">${cola.length}<small>en espera</small></span>
      </button>`;
    }).join('');
    side.querySelectorAll('[data-id]').forEach((btn) => {
      btn.addEventListener('click', () => { activeId = btn.dataset.id; render(); document.querySelector(`[data-id="${activeId}"]`).focus(); });
    });

    const c = llConsultorio(activeId);
    const paciente = state.atendiendo[activeId];
    const cola = state.colas[activeId] || [];

    document.getElementById('panelCurrent').innerHTML = `
      <div class="panel-current-label">Atendiendo ahora · ${c.nombre}</div>
      <div class="panel-current-body">
      ${paciente
        ? `<div class="panel-current-name">${paciente.nombre}</div><div class="panel-current-turno">Turno ${paciente.turno}</div>`
        : `<div class="panel-current-name is-empty">Sin paciente en atención</div>`}
      </div>
      <div class="panel-actions">
        <button class="btn btn-accent" id="btnLlamar" type="button" ${cola.length === 0 ? 'disabled' : ''}>Llamar siguiente</button>
        <button class="btn btn-secondary" id="btnRepetir" type="button" ${paciente ? '' : 'disabled'}>Volver a llamar</button>
        <button class="btn btn-ghost" id="btnFinalizar" type="button" ${paciente ? '' : 'disabled'}>Finalizar atención</button>
      </div>`;

    document.getElementById('panelColaTitle').textContent = `Cola de espera · ${cola.length} paciente${cola.length === 1 ? '' : 's'}`;
    document.getElementById('panelCola').innerHTML = cola.length
      ? cola.map((p, i) => `<div class="panel-cola-row"><span class="panel-cola-pos">${i + 1}</span><span class="doc-name">${p.nombre}</span><span class="panel-cola-turno">Turno ${p.turno}</span></div>`).join('')
      : `<div class="panel-cola-row" style="color: var(--gray-600)">No hay pacientes esperando en este consultorio</div>`;

    document.getElementById('btnLlamar').addEventListener('click', () => {
      llLlamarSiguiente(activeId);
      showToast('Paciente llamado a ' + c.nombre);
      render();
      focusAction('btnLlamar');
    });
    document.getElementById('btnRepetir').addEventListener('click', () => {
      llVolverALlamar(activeId);
      showToast('Llamando nuevamente');
      render();
      focusAction('btnRepetir');
    });
    document.getElementById('btnFinalizar').addEventListener('click', () => {
      llFinalizarAtencion(activeId);
      render();
      focusAction('btnFinalizar');
    });
  }

  document.getElementById('panelReset').addEventListener('click', () => {
    llResetDemo();
    showToast('Demo reiniciada');
    render();
  });

  render();
  llOnStateChange(render);
</script>
</body>
</html>
