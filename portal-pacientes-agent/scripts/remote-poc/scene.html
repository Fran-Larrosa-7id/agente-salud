<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escena sintética de fluidez</title><style>
*{box-sizing:border-box}body{margin:0;font:18px system-ui;background:#f4f8fa;color:#173248}header{padding:32px 20px 12px;background:white;position:sticky;top:0;z-index:1}h1{font-size:22px}input,button,select{font:inherit;padding:10px;border:1px solid #a7bdc6;border-radius:8px}input{width:100%;max-width:300px}button{background:#087d83;color:white}article{padding:20px;border-bottom:1px solid #a7bdc6;background:#e4eff3}article:nth-child(even){background:white}.bar{height:24px;width:70%;background:#a6cfd4}#marker{position:fixed;left:8px;top:8px;z-index:100;image-rendering:pixelated}#menu{position:fixed;top:190px;left:20px;background:#063f51;color:white;padding:20px;z-index:20}dialog{border:2px solid #087d83;padding:30px}#partial{position:fixed;right:4px;bottom:4px;width:28px;height:28px;background:#ff0000;z-index:10}#moving{position:fixed;top:52%;width:48px;height:48px;background:#078489;pointer-events:none;z-index:2}
</style><canvas id="marker" width="264" height="12"></canvas><header><h1>Prueba sintética · sin datos personales</h1><label>Texto de prueba <input id="text" autocomplete="off"></label><p><button id="toggle">Menú</button> <button id="open">Ventana</button> <button id="pause">Pausar animación</button> <select aria-label="Opciones"><option>Primera opción</option><option>Segunda opción</option></select></p></header><div id="menu" hidden><button id="choose">Elegir opción</button></div><dialog><p>Ventana superpuesta sintética</p><button id="close">Cerrar</button></dialog><main></main><div id="partial"></div><div id="moving"></div>
<script>
const main=document.querySelector('main');for(let i=0;i<120;i++){const el=document.createElement('article');el.innerHTML='<strong>Fila sintética '+i+'</strong><p>Texto legible y cambios de fondo.</p><div class="bar"></div>';main.appendChild(el)}
const toggle=document.getElementById('toggle'),menu=document.getElementById('menu'),choose=document.getElementById('choose'),openButton=document.getElementById('open'),marker=document.getElementById('marker'),moving=document.getElementById('moving'),partial=document.getElementById('partial');
toggle.onclick=()=>menu.hidden=!menu.hidden;choose.onclick=()=>menu.hidden=true;openButton.onclick=()=>document.querySelector('dialog').showModal();document.getElementById('close').onclick=()=>document.querySelector('dialog').close();
window.synthetic={frames:0,animate:true,scroll:true};const ctx=marker.getContext('2d');let start=performance.now();
document.getElementById('pause').onclick=()=>{synthetic.animate=!synthetic.animate;synthetic.scroll=synthetic.animate};
function tick(now){if(synthetic.animate){synthetic.frames++;const id=synthetic.frames%4096;for(const [x,word] of [[0,id],[88,id],[176,id^4095]])for(let b=0;b<12;b++){ctx.fillStyle=(word&(1<<b))?'white':'black';ctx.fillRect(x+b*6,0,6,12)}moving.style.left=((now-start)/8%Math.max(1,innerWidth-50))+'px';if(synthetic.scroll)scrollTo(0,Math.round((Math.sin((now-start)/1600)+1)*900));partial.style.background=synthetic.frames%60<30?'#ff0000':'#00ff00'}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
