<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7iDeas · Sala de espera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="css/llamador.css">
<link rel="stylesheet" href="css/llamador-brand.css">
</head>
<body class="ll-tv">
<header class="tv-header">
  <div class="tv-header-mark"><span class="dot"></span> 7iDeas · Llamador de Pacientes<span class="tv-header-sala" id="tvSala"></span></div>
  <div class="tv-clock" id="tvClock" aria-hidden="true"></div>
</header>
<main class="tv-body">
  <section class="tv-consultorios" id="tvConsultorios" aria-label="Consultorios"></section>
  <aside class="tv-history" aria-label="Últimos llamados">
    <div class="tv-now" id="tvNow"></div>
    <div class="tv-history-title">Llamados anteriores</div>
    <div class="tv-history-list" id="tvHistory"></div>
  </aside>
</main>
<script src="js/llamador.js"></script>
<script>
  function renderClock() {
    document.getElementById('tvClock').textContent = llHoraActual();
  }
  setInterval(renderClock, 1000 * 15);
  renderClock();

  let lastState = llGetState();
  function render(state) {
    lastState = state;
    const cfg = llGetConfig();
    const vis = cfg.visible;
    document.getElementById('tvSala').textContent = cfg.pantalla;
    const cont = document.getElementById('tvConsultorios');
    cont.innerHTML = LL_CONSULTORIOS.map((c) => {
      const paciente = state.atendiendo[c.id];
      const cola = state.colas[c.id] || [];
      const num = (c.nombre.match(/\d+/) || [c.nombre])[0];
      return `<div class="tv-row" data-consultorio="${c.id}">
        <div class="tv-row-num" aria-label="${c.nombre}">${vis.consultorio ? num : '·'}</div>
        <div class="tv-row-main">
          ${paciente
            ? `<div class="tv-row-paciente">${llNombreSala(paciente.nombre, paciente.id, cfg.formato)}</div>`
            : `<div class="tv-row-paciente is-empty">Sin paciente en atención</div>`}
          <div class="tv-row-prof">${[vis.profesional ? c.profesional : '', vis.especialidad ? c.especialidad : ''].filter(Boolean).join(' · ')}</div>
        </div>
        <div class="tv-row-meta">
          ${paciente ? `<div class="tv-row-turno">${paciente.turno}</div>` : ''}
          <div class="tv-row-espera">${cola.length} en espera</div>
        </div>
      </div>`;
    }).join('');

    const ultimo = state.llamados[0];
    const cu = ultimo ? llConsultorio(ultimo.consultorioId) : null;
    document.getElementById('tvNow').innerHTML = ultimo
      ? `<div class="tv-now-label">Llamando</div>
         <div class="tv-now-name">${llNombreSala(ultimo.pacienteNombre, ultimo.pacienteId, cfg.formato)}</div>
         <div class="tv-now-dest">${cu ? (vis.consultorio ? cu.nombre : (vis.profesional ? cu.profesional : 'Dirigirse al consultorio')) : ''}</div>`
      : `<div class="tv-now-label">Llamando</div><div class="tv-now-name is-empty">Sin llamados todavía</div>`;

    const hist = document.getElementById('tvHistory');
    const previos = state.llamados.slice(1);
    hist.innerHTML = previos.length
      ? previos.map((h) => {
          const c = llConsultorio(h.consultorioId);
          return `<div class="tv-history-item">
            <span class="tv-history-name">${llNombreSala(h.pacienteNombre, h.pacienteId, cfg.formato)}${h.tipo === 'repetido' ? ' (nuevamente)' : ''}</span>
            <span class="tv-history-sala">${c && vis.consultorio ? c.nombre + ' · ' : ''}${h.hora}</span>
          </div>`;
        }).join('')
      : `<div class="tv-history-item" style="color: var(--gray-600)">Sin llamados anteriores</div>`;
  }

  let flashTimer = null;
  function flashLatest(state) {
    const ultimo = state.llamados[0];
    if (!ultimo) return;
    render(state);
    const fila = document.querySelector('.tv-row[data-consultorio="' + ultimo.consultorioId + '"]');
    if (!fila) return;
    void fila.offsetWidth; // fija el estado inicial para que la transición corra
    fila.classList.add('is-flash');
    llSonar(llGetConfig().sonido);
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => fila.classList.remove('is-flash'), 4000);
  }

  const initial = llGetState();
  render(initial);

  llOnStateChange((state) => flashLatest(state));
  llOnConfigChange(() => render(lastState));
</script>
</body>
</html>
